server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Any redirect nginx generates (e.g. the directory match below) is
    # relative, not absolute — so it never hardcodes host/port and works
    # correctly behind Docker port mapping, a reverse proxy, or plain
    # localhost, without needing to know which one is in front of it.
    absolute_redirect off;

    error_page 404 /404.html;

    # Astro's static build output uses directory-style routes
    # (e.g. /about/index.html). Check the exact index file FIRST, before
    # the bare directory — checking the bare directory first would match
    # it as an existing path and trigger nginx's automatic trailing-slash
    # redirect for every page, which is one extra round trip we don't need.
    location / {
        try_files $uri/index.html $uri $uri/ =404;
    }

    location = /404.html {
        internal;
    }

    # Astro's fingerprinted build assets are safe to cache forever.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
