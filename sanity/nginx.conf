server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep any nginx-generated redirect relative so it never hardcodes a
    # host/port that doesn't match how this is actually being accessed
    # (Docker port mapping, a reverse proxy, plain localhost, etc.).
    absolute_redirect off;

    # Sanity Studio is a client-side-routed SPA — always fall back to
    # index.html and let the Studio's own router handle the path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
